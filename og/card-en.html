<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>og card en</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#666}
  .card{width:1200px;height:630px;background:#0A0A0A;color:#FFFFFF;
    font-family:'Inter',sans-serif;padding:64px 80px;
    display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .brand{font-size:22px;font-weight:500;color:#E0E0E0}
  .row{display:flex;align-items:flex-end;gap:104px}
  .num{font-family:'Syne',sans-serif;font-weight:800;font-size:176px;line-height:.78;
    letter-spacing:-.06em;font-variant-numeric:tabular-nums}
  .num--kept{color:#38B76F}
  .lbl{font-size:25px;line-height:1.25;margin-top:20px;max-width:16ch}
  .note{font-size:26px;line-height:1.4;color:#E0E0E0;max-width:54ch;margin-bottom:26px}
  .note b{color:#FFFFFF;font-weight:500}
  .dots{display:grid;grid-template-columns:repeat(33,11px);gap:5px;width:max-content}
  .dot{width:11px;height:11px;border-radius:50%;background:#38B76F}
  .dot--lost{opacity:.16}
</style>
</head>
<body>
<div class="card">
  <div class="brand">optimattic.com</div>
  <div class="row">
    <div><div class="num">99</div><div class="lbl">purchases according to Meta</div></div>
    <div><div class="num num--kept">22</div><div class="lbl">confirmed by payment</div></div>
  </div>
  <div>
    <div class="note">Meta counts a purchase for anyone who clicked an ad within seven days before buying. <b>The budget is set on 99, the decisions are made on 22.</b></div>
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span><span class="dot dot--lost"></span></div>
  </div>
</div>
</body>
</html>
